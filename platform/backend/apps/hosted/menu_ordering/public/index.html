<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点餐系统 · 用户端</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#f6f5f1; color:#2b2b2b; }
  header { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid #eee; padding:14px 0; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
  .hd { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .logo { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,#ff7a45,#ff4d4f); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
  .brand h1 { font-size:18px; }
  .brand small { color:#999; font-size:12px; display:block; }
  .hd-right { display:flex; align-items:center; gap:14px; font-size:13px; color:#666; }
  .pill { background:#f1f1ef; padding:4px 10px; border-radius:999px; font-size:12px; }
  .pill.on { background:#e8f7ee; color:#1a8a4c; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:20px; margin-top:20px; padding-bottom:60px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:16px; }
  .dish { background:#fff; border-radius:16px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.05); transition:.15s; }
  .dish:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .dish .emoji { font-size:34px; }
  .dish h3 { margin:8px 0 2px; font-size:16px; }
  .dish .cate { color:#ff7a45; font-size:12px; }
  .dish .desc { color:#999; font-size:12px; height:32px; }
  .dish .foot { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .dish .price { color:#ff4d4f; font-weight:700; font-size:16px; }
  .dish .price i { font-style:normal; font-size:11px; }
  .dish .stock { font-size:11px; color:#bbb; }
  .dish .stock.less { color:#ff4d4f; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:24px; height:24px; border-radius:8px; border:none; background:#fff4ef; color:#ff7a45; font-size:15px; cursor:pointer; }
  .qty button:disabled { opacity:.35; cursor:not-allowed; }
  .qty span { min-width:16px; text-align:center; font-weight:600; }
  .cart { position:sticky; top:86px; align-self:start; background:#fff; border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .cart h2 { font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .cart .empty { color:#bbb; text-align:center; padding:28px 0; font-size:13px; }
  .ci { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed #f0f0f0; font-size:13px; }
  .ci .nm { flex:1; }
  .ci .pt { color:#ff4d4f; }
  .seat { margin:14px 0; display:flex; align-items:center; gap:8px; font-size:13px; }
  .seat input { width:64px; padding:6px 8px; border:1px solid #e5e5e5; border-radius:8px; font-size:14px; text-align:center; }
  .total { display:flex; justify-content:space-between; font-size:14px; margin-bottom:12px; }
  .total b { color:#ff4d4f; font-size:18px; }
  .btn-main { width:100%; padding:12px; border:none; border-radius:12px; background:linear-gradient(135deg,#ff7a45,#ff4d4f); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-main:disabled { opacity:.45; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(30,30,30,.92); color:#fff; padding:10px 20px; border-radius:10px; font-size:13px; z-index:99; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; bottom:56px; }
  .orders { margin-top:24px; }
  .orders h2 { font-size:15px; margin-bottom:10px; }
  .ord { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.04); display:flex; justify-content:space-between; align-items:center; }
  .ord .dishs { font-size:13px; color:#555; }
  .ord .dishs b { color:#2b2b2b; }
  .ord .meta { font-size:11px; color:#aaa; margin-top:4px; }
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .b-已下单 { background:#fff4e6; color:#e88406; }
  .b-制作中 { background:#e8f0fe; color:#2b6cd4; }
  .b-待出餐 { background:#ede7fe; color:#7c4dff; }
  .b-已出餐 { background:#e6f7ff; color:#0899c4; }
  .b-已完成 { background:#e8f7ee; color:#1a8a4c; }
  .b-pending { background:#fff4e6; color:#e88406; }
  .ai-line { display:flex; gap:8px; margin-bottom:12px; }
  .ai-line input { flex:1; padding:8px 10px; border:1px solid #e5e5e5; border-radius:10px; font-size:13px; outline:none; }
  .ai-line input:focus { border-color:#ff7a45; }
  .btn-ai { padding:8px 12px; border:none; border-radius:10px; background:#fff4ef; color:#ff7a45; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-ai:disabled { opacity:.45; cursor:not-allowed; }
  .ai-out { background:#fff8f5; border:1px solid #ffe3d6; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.8; color:#8c4a2e; margin-bottom:12px; display:none; white-space:pre-line; }
  @media (max-width:860px){ main { grid-template-columns:1fr; } .cart { position:static; } }
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="brand">
      <div class="logo">🍽️</div>
      <div>
        <h1>川渝小馆 · 点餐</h1>
        <small>多智能体 CrewAI 底座驱动的点餐应用（menu-ordering v2.0）</small>
      </div>
    </div>
    <div class="hd-right"><span class="pill on">底座在线</span><a href="/merchant.html" style="color:#666;text-decoration:none">商家端 ↗</a></div>
  </div>
</header>

<div class="wrap main-app">
  <main>
    <section class="cards" id="menuCards"></section>
    <aside class="cart">
      <h2>我的点单 <span id="cartCount" style="color:#999;font-weight:400;font-size:12px"></span></h2>
      <div class="ai-line">
        <input id="pref" placeholder="偏好/预算，如：偏辣、150元内" onkeydown="if(event.key==='Enter')recommend()">
        <button class="btn-ai" id="btnAI" onclick="recommend()">🧠 智能推荐</button>
      </div>
      <div class="ai-out" id="aiOut"></div>
      <div id="cartItems"><div class="empty">还没有选择菜品</div></div>
      <div class="seat">🪑 用餐人数
        <input id="seatCount" type="number" min="1" max="20" value="2">
        <span style="color:#aaa">人</span>
      </div>
      <div class="total"><span>合计</span><b>￥<span id="cartTotal">0</span></b></div>
      <button class="btn-main" id="btnPlace" disabled>提交订单 · 等待商家确认</button>
      <p style="font-size:11px;color:#bbb;margin-top:8px;text-align:center">下单需商家审批，通过后自动生成订单（每 4s 自动刷新订单列表）</p>
    </aside>
  </main>

  <section class="orders">
    <h2>我的订单 <button class="btn-ai" style="float:right;padding:4px 10px;font-size:12px" onclick="notifyMe()">🔔 出餐通知</button></h2>
    <div id="orderList"><div class="ord" style="justify-content:center;color:#bbb">暂无订单</div></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="/app-sdk/sdk.js"></script>
<script>
var MENU = [];
var cart = {};          // dish_id -> qty
var myOrders = [];
var polling = false;

var $ = function (id) { return document.getElementById(id); };

function toast(msg) {
  var t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

// ---------- 智能推荐（runFlow 步1 · 开启新会话） ----------
function recommend() {
  var pref = ($("pref").value || "").trim();
  var btn = $("btnAI"); btn.disabled = true;
  AppSDK.runFlow(pref || "帮我推荐几道菜", { restart: true }).then(function (res) {
    btn.disabled = false;
    var out = $("aiOut"); out.style.display = "block";
    out.textContent = res.output;
  }).catch(function (e) { btn.disabled = false; toast(e.message); });
}

// ---------- 出餐通知（runFlow 后续流程：过敏检测 → 分支备餐 → 出餐通知，一键推进至完成） ----------
function notifyMe() {
  AppSDK.flowStatus().then(function (s) {
    if (!s || s.status === "已完成") {
      toast("暂无进行中的订单可通知（请先下单）");
      return;
    }
    if ((s.current || 0) < 2) {
      toast("请先下单，再进行出餐");
      return;
    }
    var out = $("aiOut"); out.style.display = "block"; out.textContent = "";
    function stepFlow() {
      return AppSDK.runFlow("").then(function (res) {
        out.textContent = out.textContent ? out.textContent + "\n\n" + res.output : res.output;
        if (res.flow_status !== "已完成") return stepFlow();
        toast("流程已完成（过敏分支 + 出餐通知）");
      });
    }
    return stepFlow();
  }).catch(function (e) { toast(e.message); });
}

// ---------- 菜单 ----------
function renderMenu() {
  var html = "";
  MENU.forEach(function (d) {
    var q = cart[d.id] || 0;
    html += '<div class="dish">' +
      '<div class="emoji">' + d.emoji + '</div>' +
      '<h3>' + d.name + '</h3>' +
      '<span class="cate">' + d.category + '</span>' +
      '<div class="desc">' + d.desc + '</div>' +
      '<div class="foot"><span class="price"><i>￥</i>' + d.price + '</span>' +
      '<div class="qty">' +
        '<button onclick="dec(' + d.id + ')"' + (q === 0 ? ' disabled' : '') + '>−</button>' +
        '<span>' + (q === 0 ? '' : q) + '</span>' +
        '<button onclick="inc(' + d.id + ')"' + (d.inventory <= q ? ' disabled' : '') + '>+</button>' +
      '</div></div>' +
      '<div class="stock ' + (d.inventory <= 3 ? 'less' : '') + '">库存 ' + d.inventory + '</div></div>';
  });
  $("menuCards").innerHTML = html;
}

// ---------- 购物车 ----------
function cartList() {
  return MENU.filter(function (d) { return cart[d.id] > 0; });
}
function renderCart() {
  var list = cartList();
  if (!list.length) { $("cartItems").innerHTML = '<div class="empty">还没有选择菜品</div>'; }
  else {
    $("cartItems").innerHTML = list.map(function (d) {
      return '<div class="ci"><span class="nm">' + d.emoji + ' ' + d.name + '</span>' +
        '<div class="qty"><button onclick="dec(' + d.id + ')">−</button><span>' + cart[d.id] + '</span>' +
        '<button onclick="inc(' + d.id + ')">+</button></div>' +
        '<span class="pt">￥' + (d.price * cart[d.id]) + '</span></div>';
    }).join("");
  }
  $("cartCount").textContent = list.length ? list.length + " 道" : "";
  var total = list.reduce(function (s, d) { return s + d.price * cart[d.id]; }, 0);
  $("cartTotal").textContent = total;
  var has = list.length > 0;
  $("btnPlace").disabled = !has;
  renderMenu();
}
function inc(id) { var d = MENU.find(function (x) { return x.id === id; }); if (d && cart[id] < d.inventory) { cart[id] = (cart[id] || 0) + 1; renderCart(); } }
function dec(id) { if (cart[id]) { cart[id]--; if (!cart[id]) delete cart[id]; renderCart(); } }

// ---------- 下单 ----------
function expandIds() {
  var arr = [];
  Object.keys(cart).forEach(function (id) { for (var i = 0; i < cart[id]; i++) arr.push(parseInt(id, 10)); });
  return arr;
}
function placeOrder() {
  if ($("btnPlace").disabled) return;
  var seat = parseInt($("seatCount").value, 10) || 1;
  var pref = ($("pref").value || "").trim();
  $("btnPlace").disabled = true; $("btnPlace").textContent = "订单已提交，等待商家确认…";
  toast("订单已提交，等待商家确认…（审批通过后自动出现在订单列表）");
  var payload = JSON.stringify({ dish_ids: expandIds(), seat_count: seat, note: pref });
  // 每次点餐 = 一条完整流程：推荐（步1）→ 下单（步2），restart 开启新会话
  AppSDK.runFlow(pref || "帮我推荐几道菜", { restart: true }).then(function (r) {
    var out = $("aiOut"); out.style.display = "block"; out.textContent = r.output;
    return AppSDK.runFlow(payload);
  }).then(function (res) {
    toast((res.output || "已提交").substring(0, 60));
    refreshOrders();
    if (!polling) { setInterval(refreshOrders, 4000); polling = true; }
    setTimeout(function () {
      if (!$("btnPlace").disabled) return;
      $("btnPlace").textContent = "重新提交";
      $("btnPlace").disabled = false; // 若超时仍可再下
    }, 3000);
  }).catch(function (e) {
    toast(e.message);
    $("btnPlace").textContent = "重新提交";
    $("btnPlace").disabled = false;
  });
}

// ---------- 订单轮询（每 4s，走租户数据域） ----------
function fmt(t) { return t ? t.substring(0, 16) : ""; }
function refreshOrders() {
  AppSDK.data.list("orders").then(function (res) {
    var rows = (res.rows || []).slice(0, 20);
    myOrders = rows;
    var html = "";
    rows.forEach(function (o) {
      html += '<div class="ord"><div class="dishs"><b>' + o.order_no + '</b> · ' +
        (o.dish_names || []).join("、") + '<div class="meta">' + fmt(o.created_at) +
        ' · ' + (o.seat_count || 1) + '人 · 合计 ￥' + o.total + '</div></div>' +
        '<span class="badge b-' + o.status + '">' + o.status + '</span></div>';
    });
    $("orderList").innerHTML = html || '<div class="ord" style="justify-content:center;color:#bbb">暂无订单</div>';
  }).catch(function () {});
}

// ---------- 初始化 ----------
AppSDK.getContext().then(function (ctx) {
  var h = document.querySelector(".brand small");
  if (h) h.textContent = ctx.tenant_name + " · 多智能体 CrewAI 底座驱动的点餐应用（menu-ordering v2.0）";
  return AppSDK.data.list("menu");
}).then(function (res) {
  MENU = res.rows || [];
  renderMenu(); renderCart();
}).catch(function () {});
refreshOrders();
setInterval(refreshOrders, 4000);
</script>
</body>
</html>
