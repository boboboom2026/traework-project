<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrewAI 底座 · 管理页</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#0f1420; color:#dfe6f0; min-height:100vh; }
  .wrap { max-width:1120px; margin:0 auto; padding:24px 20px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .ttl { display:flex; align-items:center; gap:12px; }
  .ttl .lg { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,#6c8cff,#9a6cff); display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; }
  .ttl h1 { font-size:19px; }
  .ttl small { display:block; color:#7d8aa0; font-size:12px; font-weight:400; }
  .st { display:flex; align-items:center; gap:18px; font-size:12px; color:#8a97ad; }
  .st .on { background:#123524; color:#4ade80; border:1px solid #1f4d33; padding:5px 12px; border-radius:999px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi { background:#161d2e; border:1px solid #222c44; border-radius:14px; padding:16px; }
  .kpi .lb { font-size:12px; color:#7d8aa0; }
  .kpi .vl { font-size:24px; font-weight:700; margin-top:6px; }
  .kpi .vl.g { color:#4ade80; } .kpi .vl.r { color:#ff6b6b; } .kpi .vl.b { color:#6c8cff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px){ .grid { grid-template-columns:1fr; } }
  .panel { background:#161d2e; border:1px solid #222c44; border-radius:14px; padding:18px; }
  .panel h3 { font-size:14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; color:#aebbcf; }
  .agent { border-bottom:1px solid #222c44; padding:12px 0; }
  .agent:last-child { border-bottom:none; }
  .agent .nm { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
  .tag { font-size:10px; padding:2px 8px; border-radius:999px; }
  .tag.busy { background:#3b2b12; color:#fbbf24; } .tag.ready { background:#123524; color:#4ade80; }
  .agent .role { font-size:12px; color:#8a97ad; margin:3px 0; }
  .agent .goal { font-size:12px; color:#6f7c93; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tl { font-size:11px; background:#1d2740; padding:3px 9px; border-radius:6px; color:#9fb3d9; }
  .tl.appr { background:#3d1320; color:#ff8fa3; }
  .trow { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #222c44; }
  .trow:last-child { border:none; }
  .trow .nm { font-weight:600; } .trow .ds { font-size:12px; color:#7d8aa0; margin-top:2px; }
  .flag { font-size:11px; padding:3px 9px; border-radius:999px; }
  .flag.req { background:#3d1320; color:#ff8fa3; } .flag.ok { background:#123524; color:#4ade80; }
  .app-card { display:flex; justify-content:space-between; align-items:center; background:#1a2236; border:1px solid #26324e; border-radius:12px; padding:14px; margin-bottom:10px; }
  .app-card .an { font-weight:700; } .app-card .av { font-size:11px; color:#7d8aa0; margin-top:2px; }
  a.link { color:#6c8cff; text-decoration:none; font-size:12px; margin-right:12px; }
  .feed { max-height:340px; overflow:auto; }
  .feed .f { padding:9px 0; border-bottom:1px dashed #222c44; font-size:12px; }
  .feed .f:last-child { border:none; }
  .feed .f b { color:#c9d4ea; }
  .feed .tm { color:#5d6a82; font-size:11px; margin-left:8px; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.p { background:#fbbf24; } .dot.a { background:#4ade80; } .dot.r { background:#ff6b6b; }
  .empty { color:#5d6a82; text-align:center; padding:20px 0; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl">
      <div class="lg">🤖</div>
      <div>
        <h1>CrewAI 多智能体底座 <small>agent_framework · 确定性执行器（可切换真实 CrewAI + LLM）</small></h1>
      </div>
    </div>
    <div class="st"><span class="on">● 运行中</span><span>10s 自动刷新</span></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel">
      <h3>智能体（Agents）<span style="color:#5d6a82" id="agentN"></span></h3>
      <div id="agents"></div>
    </div>
    <div class="panel">
      <h3>工具（Tools）<span style="color:#5d6a82" id="toolN"></span></h3>
      <div id="tools"></div>
    </div>
    <div class="panel">
      <h3>托管应用（Hosted Apps）</h3>
      <div id="apps"></div>
    </div>
    <div class="panel">
      <h3>审批动态（Approvals）</h3>
      <div class="feed" id="feed"><div class="empty">暂无记录</div></div>
    </div>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var APPS = [], APPROVALS = [], INFO = null;

function api(path) { return fetch(path).then(function (r) { return r.json().catch(function () { return {}; }); }); }

function renderKpis(info) {
  var c = info.counts || {};
  $("kpis").innerHTML =
    '<div class="kpi"><div class="lb">智能体</div><div class="vl b">' + info.agents.length + '</div></div>' +
    '<div class="kpi"><div class="lb">工具</div><div class="vl b">' + info.tools.length + '</div></div>' +
    '<div class="kpi"><div class="lb">待审批</div><div class="vl r">' + c.pending_approvals + '</div></div>' +
    '<div class="kpi"><div class="lb">订单</div><div class="vl g">' + c.orders + '</div></div>' +
    '<div class="kpi"><div class="lb">菜品</div><div class="vl">' + c.menu + '</div></div>' +
    '<div class="kpi"><div class="lb">审批记录</div><div class="vl">' + c.approvals + '</div></div>';
}

function renderAgents(info) {
  $("agentN").textContent = info.agents.length + " 个";
  $("agents").innerHTML = info.agents.map(function (a) {
    return '<div class="agent"><div class="nm">' + a.name + '<span class="tag ' + a.status + '">' + (a.status === "busy" ? "工作中" : "就绪") + '</span></div>' +
      '<div class="role">' + (a.role || "") + '</div><div class="goal">🎯 ' + (a.goal || "") + '</div>' +
      '<div class="tools">' + (a.tools || []).map(function (t) { return '<span class="tl">🔧 ' + t + '</span>'; }).join("") + '</div></div>';
  }).join("");
}

function renderTools(info) {
  $("toolN").textContent = info.tools.length + " 个";
  $("tools").innerHTML = info.tools.map(function (t) {
    var flag = t.requires_approval ? '<span class="flag req">🛡 强制审批</span>' : '<span class="flag ok">直接执行</span>';
    var args = (t.args || []).map(function (a) { return a.name + (a.required ? "*" : ""); });
    return '<div class="trow"><div><div class="nm">' + t.name + '</div>' +
      '<div class="ds">' + (t.description || "") + (args.length ? ' · 参数：' + args.join(", ") : "") + '</div></div>' + flag + '</div>';
  }).join("");
}

function renderApps() {
  $("apps").innerHTML = APPS.map(function (a) {
    return '<div class="app-card"><div><div class="an">' + a.title + ' <span style="color:#5d6a82;font-size:11px">' + a.version + '</span></div>' +
      '<div class="av">' + a.name + ' · 托管应用</div></div>' +
      '<div><a class="link" href="/">用户端 ↗</a><a class="link" href="/merchant.html">商家端 ↗</a></div></div>';
  }).join("") || '<div class="empty">暂无托管应用</div>';
}

function renderFeed() {
  if (!APPROVALS.length) return;
  var st = { pending: ["p", "待审批"], approved: ["a", "已通过"], rejected: ["r", "已拒绝"] };
  $("feed").innerHTML = APPROVALS.slice(0, 15).map(function (a) {
    var s = st[a.status] || st.pending;
    return '<div class="f"><span class="dot ' + s[0] + '"></span><b>' + (a.title || a.tool) + '</b>' +
      '<span style="color:#8a97ad"> · ' + a.requester + '</span><span class="tm">' + (a.created_at || "") + '</span>' +
      '<div style="color:#6f7c93;margin-top:2px">' + (a.reason ? "备注：" + a.reason + " · " : "") + s[1] +
      (a.result ? ' · <span style="color:#5eead4">' + a.result + "</span>" : "") + '</div></div>';
  }).join("");
}

function refresh() {
  api("/api/platform/info").then(function (r) { if (!r.agents) return; INFO = r; renderKpis(r); renderAgents(r); renderTools(r); });
  api("/api/platform/apps").then(function (r) { APPS = r.apps || []; renderApps(); });
  api("/api/approvals").then(function (r) { APPROVALS = r.approvals || []; renderFeed(); });
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
